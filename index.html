<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="./style.css">

    <!-- Font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header">
            <div>
                <img src="./images/Acenda.png" alt="Acenda logo">
            </div>

            <div>
                <ul class="nav">
                    <a href=""><li>Home</li></a>
                    <a href=""><li>Destinations</li></a>
                    <a href=""><li>Blog</li></a>
                    <a href=""><li>News</li></a>
                    <a href=""><li>Contact</li></a>
                </ul>
            </div>
        </div>


    <section class="banner-details">

        <div class="banner-txt">
            <h1>Good Morning!</h1>
            <p>Explore beautiful places in the world with Acenda</p>
        </div>

        <div class="booking">

            <!-- Location -->
            <div class="book-details">
                <div class="book-icon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div class="book-text">
                    <h3>Location</h3>
                    <p>Add destination</p>
                </div>
            </div>


            <!-- Check in -->
            <div class="book-details">
                <div class="book-icon">
                    <i class="fa-regular fa-calendar"></i>
                </div>

                <div class="book-text">
                    <h3>Check in</h3>
                    <p>Add dates</p>
                </div>
            </div>


            <!-- Check out -->
            <div class="book-details">
                <div class="book-icon">
                    <i class="fa-regular fa-calendar"></i>
                </div>

                <div class="book-text">
                    <h3>Check out</h3>
                    <p>Add dates</p>
                </div>
            </div>


            <!-- Guests -->
            <div class="book-details">
                <div class="book-icon">
                    <i class="fa-solid fa-user-group"></i>
                </div>

                <div class="book-text">
                    <h3>Guests</h3>
                    <p>Add guests</p>
                </div>
            </div>


            <!-- Search Button -->
            <button class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

        </div>

    </section>
    </header>

</body>
</html>
